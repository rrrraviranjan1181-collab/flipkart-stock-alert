
name: Flipkart Website Stock Check

on:
  issues:
    types: [opened]

  workflow_dispatch:
    inputs:
      product_url:
        description: "Flipkart product URL"
        required: true
        type: string

      request_id:
        description: "Unique request ID"
        required: true
        type: string

      monitor_id:
        description: "Monitor ID for recurring checks"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  issue-check:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'Stock Check:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Extract product URL
        id: product
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          body = os.environ.get("ISSUE_BODY", "")
          urls = re.findall(r"https?://[^\s<>]+", body)
          valid = []

          for url in urls:
              url = url.rstrip(".,);]")
              parsed = urlparse(url)
              host = (parsed.hostname or "").lower()

              if parsed.scheme in ("http", "https") and (
                  host == "flipkart.com"
                  or host.endswith(".flipkart.com")
              ):
                  valid.append(url)

          if len(valid) != 1:
              raise SystemExit(
                  "Issue must contain exactly one Flipkart product URL."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("url=" + valid[0] + "\n")
          PY

      - name: Run stock checker
        env:
          PRODUCT_URL: ${{ steps.product.outputs.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p docs/results
          python stock_check.py \
            "$PRODUCT_URL" \
            "docs/results/issue-${ISSUE_NUMBER}.json"

      - name: Publish website result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/results/issue-${{ github.event.issue.number }}.json"
          git commit -m "Publish stock results for issue #${{ github.event.issue.number }}"
          git push

      - name: Comment with website link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.issue.number;
            const url =
              `https://${context.repo.owner}.github.io/${context.repo.repo}/?issue=${number}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: `Check the website for your stock results: ${url}`
            });

  automatic-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Validate request
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          MONITOR_ID: ${{ inputs.monitor_id }}
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          url = os.environ["PRODUCT_URL"]
          request_id = os.environ["REQUEST_ID"]
          monitor_id = os.environ.get("MONITOR_ID", "")

          parsed = urlparse(url)
          host = (parsed.hostname or "").lower()

          if (
              parsed.scheme != "https"
              or not (
                  host == "flipkart.com"
                  or host.endswith(".flipkart.com")
              )
          ):
              raise SystemExit("Only HTTPS Flipkart URLs are allowed.")

          if not re.fullmatch(r"[a-f0-9-]{36}", request_id):
              raise SystemExit("Invalid request ID.")

          if monitor_id and not re.fullmatch(
              r"[a-f0-9-]{36}", monitor_id
          ):
              raise SystemExit("Invalid monitor ID.")
          PY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run stock checker
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p docs/results
          python stock_check.py \
            "$PRODUCT_URL" \
            "docs/results/${REQUEST_ID}.json"

      - name: Publish automatic result
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/results/${REQUEST_ID}.json"
          git commit -m "Publish automatic stock result ${REQUEST_ID}"
          git push
