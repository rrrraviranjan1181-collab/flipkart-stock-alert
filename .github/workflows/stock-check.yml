
name: User Stock Monitor

on:
  workflow_dispatch:
    inputs:
      product_url:
        description: "Product URL supplied by the monitor"
        required: true
        type: string
      request_id:
        description: "Unique ID for this check"
        required: true
        type: string
      monitor_id:
        description: "Monitor ID in the database"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stock-monitor-${{ inputs.monitor_id }}
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate inputs
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          REQUEST_ID: ${{ inputs.request_id }}
          MONITOR_ID: ${{ inputs.monitor_id }}
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          url = os.environ["PRODUCT_URL"]
          parsed = urlparse(url)
          host = (parsed.hostname or "").lower()

          if (
              parsed.scheme != "https"
              or not (
                  host == "flipkart.com"
                  or host.endswith(".flipkart.com")
              )
          ):
              raise SystemExit("Only HTTPS Flipkart URLs are allowed.")

          for name in ("REQUEST_ID", "MONITOR_ID"):
              if not re.fullmatch(
                  r"[a-fA-F0-9-]{36}", os.environ[name]
              ):
                  raise SystemExit(f"Invalid {name}.")
          PY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check requested product
        env:
          PRODUCT_URL: ${{ inputs.product_url }}
          OUTPUT_JSON: result.json
        run: python app.py

      - name: Save result artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-result-${{ inputs.request_id }}
          path: result.json
          if-no-files-found: error
          retention-days: 7
