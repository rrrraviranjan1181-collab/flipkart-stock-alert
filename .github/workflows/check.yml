
name: Flipkart Page Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check-product:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Read product page
        env:
          PRODUCT_URL: https://www.flipkart.com/adidas-solid-men-round-neck-black-t-shirt/p/itma8b701e39e950?pid=TSHHNNHCKTYHWHGN&marketplace=FLIPKART&lid=LSTTSHHNNHCKTYHWHGNCQBKSM&affid=inf_171ab171-5bdf-43ca-a197-6b0847941973&_refId=&_appId=CL
          SIZE_LABEL: M
        run: python app.py
