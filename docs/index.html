
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flipkart Size Stock Checker</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f3f6fb;
  color: #172033;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header {
  background: #1769e0;
  color: white;
  text-align: center;
  padding: 28px 16px;
}
h1 { margin: 0; font-size: 25px; }
header p { font-size: 14px; }
main { max-width: 650px; width: 92%; margin: 24px auto; }
.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  margin-bottom: 18px;
  box-shadow: 0 4px 18px #1720330b;
}
label { display: block; font-weight: 700; margin-bottom: 10px; }
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
}
button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #1769e0;
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}
button:disabled { opacity: .6; cursor: wait; }
.note { color: #687386; font-size: 13px; line-height: 1.6; }
#statusCard[hidden], #resultsCard[hidden] { display: none; }
.progressTrack {
  height: 8px;
  background: #e5eaf2;
  border-radius: 10px;
  overflow: hidden;
  margin: 14px 0;
}
.progressBar {
  height: 100%;
  width: 8%;
  background: #1769e0;
  border-radius: 10px;
  transition: width .4s;
}
table { width: 100%; text-align: left; border-collapse: collapse; }
th, td { padding: 11px 8px; border-bottom: 1px solid #e5eaf2; }
.statusAvailable { color: #14804a; font-weight: 700; }
.statusOut { color: #c0392b; font-weight: 700; }
.statusUnknown { color: #8a6500; font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>Flipkart Stock Checker</h1>
  <p>Check clothing sizes from a product link</p>
</header>

<main>
  <section class="card">
    <form id="stockForm">
      <label for="productUrl">Flipkart product URL</label>
      <input id="productUrl" type="url"
        placeholder="Paste a Flipkart product link"
        autocomplete="url" required>
      <button id="checkButton" type="submit">Check Stock</button>
    </form>
    <p class="note">
      Paste the product link and wait here. Your results will appear
      automatically when the check finishes.
    </p>
  </section>

  <section class="card" id="statusCard" hidden>
    <h3 id="statusTitle">Starting stock check…</h3>
    <p id="statusMessage" class="note" aria-live="polite">
      Contacting the stock checker.
    </p>
    <div class="progressTrack">
      <div class="progressBar" id="progressBar"></div>
    </div>
    <p class="note" id="elapsed">Preparing request…</p>
  </section>

  <section class="card" id="resultsCard" hidden>
    <h3 id="productTitle">Stock results</h3>
    <p class="note" id="checkedAt"></p>
    <div id="results"></div>
    <p class="note" id="resultNote"></p>
    <button id="checkAgain" type="button">Check Another Product</button>
  </section>
</main>

<script>
const API_URL =
  "https://flipkart-stock-api.rraviranjan1181.workers.dev/check";

const OWNER = "rrrraviranjan1181-collab";
const REPO = "flipkart-stock-alert";

const form = document.getElementById("stockForm");
const input = document.getElementById("productUrl");
const checkButton = document.getElementById("checkButton");
const statusCard = document.getElementById("statusCard");
const statusTitle = document.getElementById("statusTitle");
const statusMessage = document.getElementById("statusMessage");
const progressBar = document.getElementById("progressBar");
const elapsed = document.getElementById("elapsed");
const resultsCard = document.getElementById("resultsCard");
const resultsBox = document.getElementById("results");

let busy = false;

function setProgress(percent, title, message) {
  progressBar.style.width = percent + "%";
  statusTitle.textContent = title;
  statusMessage.textContent = message;
}

function validateProductUrl(raw) {
  let url;

  try {
    url = new URL(raw);
  } catch {
    throw new Error("Please enter a valid product URL.");
  }

  const host = url.hostname.toLowerCase();

  if (
    url.protocol !== "https:" ||
    !(host === "flipkart.com" || host.endsWith(".flipkart.com"))
  ) {
    throw new Error("Please enter an HTTPS Flipkart product link.");
  }

  return url.href;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function loadResult(requestId, startedAt) {
  const resultUrl =
    `https://${OWNER}.github.io/${REPO}/results/${requestId}.json`;

  const deadline = Date.now() + 5 * 60 * 1000;
  let attempts = 0;

  while (Date.now() < deadline) {
    attempts++;

    const seconds = Math.floor((Date.now() - startedAt) / 1000);
    elapsed.textContent = `Elapsed time: ${seconds}s`;

    if (attempts < 4) {
      setProgress(
        25,
        "Stock check queued",
        "GitHub Actions is preparing your request."
      );
    } else if (attempts < 12) {
      setProgress(
        45,
        "Checking product",
        "The stock checker is processing the Flipkart page."
      );
    } else {
      setProgress(
        70,
        "Waiting for results",
        "The check may take a little longer while results are published."
      );
    }

    try {
      const response = await fetch(
        resultUrl + "?t=" + Date.now(),
        { cache: "no-store" }
      );

      if (response.ok) {
        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.error || "The stock check failed.");
        }

        showResults(data);
        setProgress(100, "Stock check complete", "Results loaded.");
        return;
      }

      if (response.status !== 404 && response.status !== 503) {
        throw new Error("Could not retrieve the published result.");
      }
    } catch (error) {
      if (
        error.message &&
        !error.message.includes("Failed to fetch") &&
        !error.message.includes("NetworkError")
      ) {
        throw error;
      }
    }

    await sleep(4000);
  }

  throw new Error(
    "This check is taking longer than expected. Please try again later."
  );
}

function showResults(data) {
  document.getElementById("productTitle").textContent =
    data.title || "Stock results";

  document.getElementById("checkedAt").textContent =
    data.checked_at ? "Checked: " + data.checked_at : "";

  document.getElementById("resultNote").textContent = data.note || "";

  resultsBox.replaceChildren();

  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const headerRow = document.createElement("tr");

  for (const label of ["Size", "Status"]) {
    const th = document.createElement("th");
    th.textContent = label;
    headerRow.appendChild(th);
  }

  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");

  for (const item of data.results || []) {
    const tr = document.createElement("tr");
    const size = document.createElement("td");
    const status = document.createElement("td");

    size.textContent = item.size || "—";
    status.textContent = item.status || "UNKNOWN";

    if (item.status === "AVAILABLE") {
      status.className = "statusAvailable";
    } else if (item.status === "OUT_OF_STOCK") {
      status.className = "statusOut";
    } else {
      status.className = "statusUnknown";
    }

    tr.append(size, status);
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  resultsBox.appendChild(table);

  resultsCard.hidden = false;
}

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (busy) return;

  let productUrl;

  try {
    productUrl = validateProductUrl(input.value.trim());
  } catch (error) {
    alert(error.message);
    return;
  }

  busy = true;
  checkButton.disabled = true;
  checkButton.textContent = "Checking…";
  statusCard.hidden = false;
  resultsCard.hidden = true;
  resultsBox.replaceChildren();

  const startedAt = Date.now();
  setProgress(
    8,
    "Starting stock check",
    "Sending your product link securely to the checker."
  );

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product_url: productUrl })
    });

    let payload;

    try {
      payload = await response.json();
    } catch {
      throw new Error("The stock checker returned an invalid response.");
    }

    if (!response.ok || !payload.ok || !payload.request_id) {
      throw new Error(payload.error || "Could not start the stock check.");
    }

    setProgress(
      20,
      "Request accepted",
      "GitHub Actions has been asked to run your stock check."
    );

    await loadResult(payload.request_id, startedAt);
  } catch (error) {
    setProgress(
      100,
      "Unable to finish",
      error.message || "Something went wrong."
    );
  } finally {
    busy = false;
    checkButton.disabled = false;
    checkButton.textContent = "Check Stock";
  }
});

document.getElementById("checkAgain").addEventListener("click", () => {
  resultsCard.hidden = true;
  statusCard.hidden = true;
  input.focus();
});
</script>
</body>
</html>
