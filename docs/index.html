
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flipkart Size Stock Checker</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f3f6fb;
  color: #172033;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
header {
  background: #1769e0;
  color: white;
  text-align: center;
  padding: 28px 16px;
}
h1 { margin: 0; font-size: 25px; }
header p { font-size: 14px; }
main { max-width: 650px; width: 92%; margin: 24px auto; }
.card {
  background: white;
  padding: 22px;
  border-radius: 15px;
  margin-bottom: 18px;
  box-shadow: 0 4px 18px #1720330b;
}
label { display: block; font-weight: 700; margin-bottom: 10px; }
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
}
button {
  width: 100%;
  margin-top: 12px;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #1769e0;
  color: white;
  font-size: 16px;
  font-weight: 700;
}
.note { color: #687386; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <h1>Flipkart Stock Checker</h1>
  <p>Check clothing sizes from a product link</p>
</header>

<main>
  <section class="card">
    <form id="stockForm">
      <label for="productUrl">Flipkart product URL</label>
      <input id="productUrl" type="url"
        placeholder="Paste a Flipkart product link" required>
      <button type="submit">Check Stock</button>
    </form>
    <p class="note">
      Submit a request through GitHub. Once processing finishes,
      the results will be available on this website.
    </p>
  </section>

  <section class="card">
    <h3>View your results</h3>
    <label for="issueNumber">Request number</label>
    <input id="issueNumber" type="number" min="1"
      placeholder="Enter your GitHub issue number">
    <button id="viewResults" type="button">Show Results</button>
    <p id="message" class="note"></p>
    <div id="results"></div>
  </section>
</main>

<script>
const OWNER = "rrrraviranjan1181-collab";
const REPO = "flipkart-stock-alert";

document.getElementById("stockForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const raw = document.getElementById("productUrl").value.trim();

  try {
    const u = new URL(raw);
    if (!["http:", "https:"].includes(u.protocol) ||
        !(u.hostname === "flipkart.com" ||
          u.hostname.endsWith(".flipkart.com"))) {
      alert("Please enter a valid Flipkart product link.");
      return;
    }
  } catch {
    alert("Please enter a valid product link.");
    return;
  }

  const target =
    `https://github.com/${OWNER}/${REPO}/issues/new?title=` +
    encodeURIComponent("Stock Check: Flipkart product") +
    "&body=" + encodeURIComponent(
      "Please check this Flipkart product:\n\n" + raw
    );

  window.location.href = target;
});

document.getElementById("viewResults").addEventListener("click", async function() {
  const issue = document.getElementById("issueNumber").value.trim();
  const message = document.getElementById("message");
  const results = document.getElementById("results");

  results.innerHTML = "";

  if (!/^[1-9][0-9]*$/.test(issue)) {
    message.textContent = "Enter the issue number first.";
    return;
  }

  message.textContent = "Loading results…";

  try {
    const url =
      `https://${OWNER}.github.io/${REPO}/results/issue-${issue}.json?t=` +
      Date.now();

    const response = await fetch(url, {cache: "no-store"});

    if (!response.ok) {
      throw new Error("Results are not published yet. Please wait and retry.");
    }

    const data = await response.json();

    if (!data.ok) {
      throw new Error(data.error || "The stock check failed.");
    }

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      '"': "&quot;", "'": "&#39;"
    })[c]);

    let html = `<h3>${esc(data.title)}</h3>`;
    html += `<p class="note">Checked: ${esc(data.checked_at)}</p>`;
    html += "<table style='width:100%;text-align:left;border-collapse:collapse'>";
    html += "<tr><th>Size</th><th>Status</th></tr>";

    for (const item of data.results || []) {
      const color = item.status === "AVAILABLE" ? "green" : "red";
      html += `<tr><td style="padding:10px">${esc(item.size)}</td>`;
      html += `<td style="padding:10px;color:${color}">`;
      html += `${esc(item.status)}</td></tr>`;
    }

    html += "</table>";
    html += `<p class="note">${esc(data.note || "")}</p>`;
    results.innerHTML = html;
    message.textContent = "Results loaded.";
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>
</body>
</html>
